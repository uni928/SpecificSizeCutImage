<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>指定サイズで切り抜き</title>
<style>
  :root{
    --bg: radial-gradient(1200px 800px at 20% 10%, #2f6bff22, transparent 60%),
          radial-gradient(1000px 600px at 80% 90%, #ff2fa822, transparent 60%),
          linear-gradient(180deg, #0b0f14, #0a0c10);
    --card: #0f141b;
    --muted: #9fb0c2;
    --acc: #6aa1ff;
    --acc-2: #ff69b4;
  }
  html,body{height:100%}
  body{
    margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Noto Sans, "Yu Gothic UI", "Hiragino Kaku Gothic ProN", Meiryo, Arial, sans-serif;
    color:#e7eef7; background: var(--bg); display:grid; place-items:center;
  }
  .wrap{ width:min(1100px, 96vw); padding:24px; }
  .title{ font-weight:800; letter-spacing:.02em; font-size:clamp(22px, 3.2vw, 36px); margin:6px 0 18px; }
  .subtitle{ color:var(--muted); margin-top:-4px; margin-bottom:18px; }
  .panel{
    background: linear-gradient(180deg, #0c1218, #0b1116); border:1px solid #18222e; border-radius:20px; 
    box-shadow: 0 10px 40px #0008, inset 0 1px 0 #ffffff10;
    overflow:hidden;
  }
  .toolbar{ display:flex; flex-wrap:wrap; gap:12px; align-items:end; padding:16px 16px 12px; border-bottom:1px solid #1a2430; background: linear-gradient(180deg, #0f1620, #0d141b); position:sticky; top:0; z-index:5 }
  .tool{ display:grid; gap:6px }
  .tool label{ font-size:12px; color:#a8b5c3 }
  input[type="number"]{ 
    background:#0b1117; color:#e7eef7; border:1px solid #223143; border-radius:12px; padding:10px 12px; width:110px; 
    outline:none; box-shadow: inset 0 0 0 1px #0008;
  }
  input[type="number"]:focus{ border-color:#2f6bff; box-shadow: 0 0 0 3px #2f6bff33 }
  .file{ display:flex; gap:10px; align-items:center }
  .file input[type=file]{
    --pad: 10px; --br:12px;
    appearance:none; border:none; background:#0b1117; border:1px dashed #2a3a4e; color:#cfe0f3; padding:var(--pad) 14px; border-radius:var(--br);
  }
  .btn{
    appearance:none; border:none; padding:12px 16px; border-radius:14px; font-weight:700; letter-spacing:.02em; 
    background: linear-gradient(180deg, #2f6bff, #2159e6); color:white; box-shadow:0 10px 24px #2f6bff44, inset 0 1px 0 #fff8;
    cursor:pointer; transition: transform .06s ease, box-shadow .2s ease, filter .2s ease; white-space:nowrap;
  }
  .btn:hover{ filter: brightness(1.08) }
  .btn:active{ transform: translateY(1px) }
  .btn.sec{ background: linear-gradient(180deg, #ff6bb5, #e74c9e); box-shadow:0 10px 24px #ff6bb544, inset 0 1px 0 #fff6 }

  .canvas-area{ position:relative; background: #0a0f14; display:grid; place-items:center; height: min(70vh, 72dvh); padding:16px }
  .stage{ position:relative; max-width:100%; max-height:100%; }
  .stage img{ display:block; max-width:100%; max-height:68vh; height:auto; border-radius:14px; box-shadow:0 20px 60px #000a }

  /* Crop rectangle */
  .crop{
    position:absolute; left:0; top:0; width:160px; height:160px; cursor:move; 
    outline:1px solid #fff; border-radius:10px; box-shadow: 0 0 0 200vmax rgba(0,0,0,.45);
    /* fancy border */
    background-repeat:no-repeat; background-image:
      linear-gradient(90deg, #fff 0 0), linear-gradient(90deg, #fff 0 0),
      linear-gradient(180deg, #fff 0 0), linear-gradient(180deg, #fff 0 0);
    background-size: 24px 2px, 24px 2px, 2px 24px, 2px 24px;
    background-position: left top, right bottom, left top, right bottom;
  }
  .crop .guide{ position:absolute; inset:0; border-radius:10px; pointer-events:none; 
    background-image: linear-gradient(#ffffff80 0 0), linear-gradient(#ffffff80 0 0);
    background-size: 100% 1px, 1px 100%; background-position: 50% 0, 0 50%; background-repeat:no-repeat; opacity:.5;
  }
  .badge{ position:absolute; top:-34px; left:0; padding:6px 10px; font-size:12px; background:#000a; border:1px solid #223143; border-radius:10px; color:#cfe0f3 }
  .hint{ color:#96a9bf; font-size:13px; padding:10px 16px 18px; border-top:1px dashed #203042; background:linear-gradient(180deg, #0c131a, #0b1117) }
  .hint kbd{ background:#111925; border:1px solid #223143; border-bottom-color:#1a2635; border-radius:6px; padding:2px 6px; font:600 12px/1 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; color:#e7eef7 }

  .footer{ color:#88a0b8; font-size:12px; text-align:center; margin-top:12px }
</style>
</head>
<body>
  <div class="wrap">
    <div class="title">画像を指定サイズで切り抜く</div>
    <div class="subtitle">数値を入力してドラッグするだけ。外側は自動で暗くなり、切り取り範囲が一目で分かります。</div>

    <div class="panel">
      <div class="toolbar">
        <div class="tool file">
          <label for="file">画像を選択</label>
          <input id="file" type="file" accept="image/*" />
        </div>
        <div class="tool">
          <label for="w">横幅 (px)</label>
          <input id="w" type="number" min="1" step="1" value="160">
        </div>
        <div class="tool">
          <label for="h">縦幅 (px)</label>
          <input id="h" type="number" min="1" step="1" value="160">
        </div>
        <div class="tool">
          <label>拡大して使用</label>
          <div style="display:flex; gap:12px; align-items:center; padding-top:2px">
            <label style="display:flex; align-items:center; gap:6px; font-size:14px;"><input id="scale2" type="checkbox"> 2倍</label>
            <label style="display:flex; align-items:center; gap:6px; font-size:14px;"><input id="scale4" type="checkbox"> 4倍</label>
          </div>
        </div>
        <div class="tool">
          <button id="download" class="btn">切り取ってダウンロード</button>
        </div>
        <div class="tool">
          <button id="centerBtn" class="btn sec" title="矩形を中央に">中央に配置</button>
        </div>
      </div>

      <div class="canvas-area">
        <div id="stage" class="stage" aria-live="polite">
          <img id="img" alt="プレビュー" hidden />
          <div id="crop" class="crop" hidden>
            <div class="guide"></div>
            <div id="badge" class="badge">160 × 160</div>
          </div>
        </div>
      </div>

      <div class="hint">
        使い方：画像を選んでから <kbd>W/H</kbd> にピクセルを入力 → 画像上の白い枠をドラッグして位置を決め → 「切り取ってダウンロード」。<br/>
        ショートカット：<kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> で1px移動（<kbd>Shift</kbd>で10px）。<br/>
        メモ：表示サイズに関わらず、最終出力は入力したピクセル数でエクスポートされます。
      </div>
    </div>

    <div class="footer">© 2025 – シングルHTML / ローカル保存なし</div>
  </div>

<script>
(function(){
  // ==== Elements ====
  const fileInput = document.getElementById('file');
  const img = document.getElementById('img');
  const stage = document.getElementById('stage');
  const crop = document.getElementById('crop');
  const badge = document.getElementById('badge');
  const wInput = document.getElementById('w');
  const hInput = document.getElementById('h');
  const downloadBtn = document.getElementById('download');
  const centerBtn = document.getElementById('centerBtn');
  const scale2 = document.getElementById('scale2');
  const scale4 = document.getElementById('scale4');

  // ==== State ====
  let objectURL = '';
  const baseImage = new Image(); // 元画像（非表示）
  let origNaturalW = 0, origNaturalH = 0; // 元画像の原寸

  // 使用中の原寸（拡大適用後）
  let naturalW = 0, naturalH = 0;
  let upCanvas = null; // 2x/4x のソース
  let scaleFactor = 1; // 1 | 2 | 4

  // 表示サイズ（img要素の描画サイズ）とスケール
  let dispW = 0, dispH = 0;
  let scaleX = 1, scaleY = 1; // natural = display * scale

  // 出力ピクセル数（ユーザー入力）
  let cropW_px = 160, cropH_px = 160;
  // 表示座標系での矩形左上
  let cropDX = 0, cropDY = 0;

  // ==== UI helpers ====
  function updateBadge(){ badge.textContent = `${cropW_px} × ${cropH_px}`; }

  function updateScales(){
    dispW = img.clientWidth; dispH = img.clientHeight;
    if (!dispW || !dispH) return;
    scaleX = naturalW / dispW;
    scaleY = naturalH / dispH;
    const dw = cropW_px / scaleX; // 表示上の幅
    const dh = cropH_px / scaleY; // 表示上の高
    crop.style.width = dw + 'px';
    crop.style.height = dh + 'px';
    clampRect();
  }

  function clampRect(){
    const dw = parseFloat(crop.style.width) || 0;
    const dh = parseFloat(crop.style.height) || 0;
    cropDX = Math.max(0, Math.min(cropDX, Math.max(0, dispW - dw)));
    cropDY = Math.max(0, Math.min(cropDY, Math.max(0, dispH - dh)));
    crop.style.left = cropDX + 'px';
    crop.style.top = cropDY + 'px';
  }

  function centerRect(){
    const dw = parseFloat(crop.style.width) || 0;
    const dh = parseFloat(crop.style.height) || 0;
    cropDX = Math.max(0, (dispW - dw)/2);
    cropDY = Math.max(0, (dispH - dh)/2);
    clampRect();
  }

  // ==== Image loading & scaling ====
  baseImage.onload = function(){
    origNaturalW = baseImage.naturalWidth;
    origNaturalH = baseImage.naturalHeight;
    rebuildDisplaySource();
  };

  function loadFile(file){
    // 古いURL掃除
    if (objectURL) URL.revokeObjectURL(objectURL);
    objectURL = URL.createObjectURL(file);
    baseImage.src = objectURL;
  }

  function rebuildDisplaySource(){
    if (!origNaturalW || !origNaturalH) return;
    if (scaleFactor === 1){
      upCanvas = null;
      naturalW = origNaturalW; naturalH = origNaturalH;
      img.onload = function(){ img.hidden = false; crop.hidden = false; requestAnimationFrame(()=>{ updateScales(); centerRect(); }); };
      img.src = objectURL; // 元サイズのまま表示
    } else {
      const cw = Math.max(1, Math.round(origNaturalW * scaleFactor));
      const ch = Math.max(1, Math.round(origNaturalH * scaleFactor));
      const cvs = document.createElement('canvas');
      cvs.width = cw; cvs.height = ch;
      const c = cvs.getContext('2d');
      c.imageSmoothingEnabled = true;
      c.imageSmoothingQuality = 'high';
      c.drawImage(baseImage, 0, 0, origNaturalW, origNaturalH, 0, 0, cw, ch);
      upCanvas = cvs; naturalW = cw; naturalH = ch;
      img.onload = function(){ img.hidden = false; crop.hidden = false; requestAnimationFrame(()=>{ updateScales(); centerRect(); }); };
      img.src = cvs.toDataURL('image/png'); // 拡大版を目で見て操作
    }
  }

  function applyScaleOption(){
    const prev = scaleFactor;
    if (scale4 && scale4.checked){ scaleFactor = 4; if (scale2) scale2.checked = false; }
    else if (scale2 && scale2.checked){ scaleFactor = 2; if (scale4) scale4.checked = false; }
    else { scaleFactor = 1; }

    if (origNaturalW && prev !== scaleFactor){
      rebuildDisplaySource();
    }
  }

  // ==== Event wiring ====
  fileInput.addEventListener('change', (e)=>{
    const f = e.target.files && e.target.files[0];
    if (f) loadFile(f);
  });

  function onDimChange(){
    const wv = Math.max(1, Math.floor(+wInput.value || 1));
    const hv = Math.max(1, Math.floor(+hInput.value || 1));
    cropW_px = wv; cropH_px = hv; updateBadge(); updateScales();
  }
  wInput.addEventListener('input', onDimChange);
  hInput.addEventListener('input', onDimChange);

  // ドラッグ移動（Pointer API）
  let dragging = false; let startX=0, startY=0, startDX=0, startDY=0;
  crop.addEventListener('pointerdown', (ev)=>{
    if (img.hidden) return;
    dragging = true; crop.setPointerCapture(ev.pointerId);
    startX = ev.clientX; startY = ev.clientY; startDX = cropDX; startDY = cropDY;
  });
  crop.addEventListener('pointermove', (ev)=>{
    if (!dragging) return;
    const dx = ev.clientX - startX; const dy = ev.clientY - startY;
    cropDX = startDX + dx; cropDY = startDY + dy; clampRect();
  });
  function endDrag(ev){ if (!dragging) return; dragging = false; try{ crop.releasePointerCapture(ev.pointerId); }catch(_){ } }
  crop.addEventListener('pointerup', endDrag);
  crop.addEventListener('pointercancel', endDrag);

  // キー移動
  stage.tabIndex = 0;
  stage.addEventListener('keydown', (e)=>{
    if (img.hidden) return;
    const step = e.shiftKey ? 10 : 1;
    let used = true;
    switch(e.key){
      case 'ArrowLeft': cropDX -= step; break;
      case 'ArrowRight': cropDX += step; break;
      case 'ArrowUp': cropDY -= step; break;
      case 'ArrowDown': cropDY += step; break;
      default: used = false;
    }
    if (used){ e.preventDefault(); clampRect(); }
  });

  // リサイズ
  new ResizeObserver(()=>{ if (!img.hidden) updateScales(); }).observe(stage);
  window.addEventListener('resize', ()=>{ if (!img.hidden) updateScales(); });

  // 2倍/4倍
  if (scale2) scale2.addEventListener('change', applyScaleOption);
  if (scale4) scale4.addEventListener('change', applyScaleOption);

  // ダウンロード
  downloadBtn.addEventListener('click', ()=>{
    if (img.hidden){ alert('先に画像を選択してください。'); return; }
    const sx = Math.round(cropDX * scaleX);
    const sy = Math.round(cropDY * scaleY);
    const sw = Math.round(cropW_px);
    const sh = Math.round(cropH_px);

    const maxX = Math.max(0, naturalW - sw);
    const maxY = Math.max(0, naturalH - sh);
    const sxc = Math.max(0, Math.min(sx, maxX));
    const syc = Math.max(0, Math.min(sy, maxY));

    const cvs = document.createElement('canvas');
    cvs.width = sw; cvs.height = sh;
    const ctx = cvs.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    const source = upCanvas || baseImage;
    ctx.drawImage(source, sxc, syc, sw, sh, 0, 0, sw, sh);

    const name = `crop_${sw}x${sh}.png`;
    cvs.toBlob((blob)=>{
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
    }, 'image/png');
  });

  centerBtn.addEventListener('click', ()=>{ if (!img.hidden){ centerRect(); } });
  stage.addEventListener('click', ()=>{ stage.focus(); });
})();
</script>
</body>
</html>
